<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simuladores · exa energia</title>
<script>try{var t=localStorage.getItem('exa-tema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF4E6; --card:#FFFFFF; --card2:#F4EAD6; --panel:#EEF1DA; --chip:#EBDDC4;
  --accent:#1DA05A; --accent2:#17834B; --head:#12110E; --text:#3F3A32;
  --body:#5E574C; --dim:#9A9286; --border:#E8DCC6; --warn:#C25B4E;
  --word:#123D2A; --mark:#123D2A; --onaccent:#12110E; --shadow:0 1px 2px rgba(74,42,14,.06);
  --grad:linear-gradient(115deg,#F9C846 0%,#F5AE3A 22%,#A9D06A 52%,#1DA05A 100%);
  --gradtxt:linear-gradient(100deg,#C77A0E 0%,#B98A12 30%,#4F8F33 65%,#17834B 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --bg:#13120E; --card:#1B1915; --card2:#24211C; --panel:#1E2719; --chip:#24211C;
  --accent:#2FA866; --accent2:#A9D06A; --head:#FBF4E6; --text:#EAE1CF;
  --body:#B8AF9F; --dim:#8A8276; --border:#2E2A23; --warn:#E08C84;
  --word:#FBF4E6; --mark:#FBF4E6; --onaccent:#12110E; --shadow:none;
  --grad:linear-gradient(115deg,#F9C846 0%,#F5AE3A 22%,#A9D06A 52%,#1DA05A 100%);
  --gradtxt:linear-gradient(100deg,#F9C846 0%,#F5AE3A 24%,#B5CF6A 56%,#2FA866 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#13120E; --card:#1B1915; --card2:#24211C; --panel:#1E2719; --chip:#24211C;
  --accent:#2FA866; --accent2:#A9D06A; --head:#FBF4E6; --text:#EAE1CF;
  --body:#B8AF9F; --dim:#8A8276; --border:#2E2A23; --warn:#E08C84;
  --word:#FBF4E6; --mark:#FBF4E6; --onaccent:#12110E; --shadow:none;
  --grad:linear-gradient(115deg,#F9C846 0%,#F5AE3A 22%,#A9D06A 52%,#1DA05A 100%);
  --gradtxt:linear-gradient(100deg,#F9C846 0%,#F5AE3A 24%,#B5CF6A 56%,#2FA866 100%);
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);
font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:64px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.logo{width:150px;height:auto;display:block}
.themebtn{background:var(--card);color:var(--body);border:1px solid var(--border);border-radius:999px;padding:8px 15px;font:inherit;font-size:12px;cursor:pointer}
.themebtn:hover{color:var(--head)}
h1{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);
color:var(--head);margin:0 0 30px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent2)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:14px;
padding:24px;text-decoration:none;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
a.card h2{font-family:'Instrument Sans',system-ui,sans-serif;font-size:19px;color:var(--head);margin:0 0 6px}
a.card p{margin:0;font-size:13.5px;color:var(--body)}
a.card .go{display:inline-block;margin-top:auto;padding-top:14px;font-size:12px;font-weight:700;color:var(--accent2)}
footer{margin-top:44px;font-size:11.5px;color:var(--dim)}

/* ---- identidade visual exaenergia.com: Instrument Sans, Geist Mono nos
   rotulos, botoes e campos em pilula, degrade da marca nos destaques ---- */
body{letter-spacing:-.005em}
h1{font-weight:500; letter-spacing:-.035em}
h1 em{background:var(--gradtxt); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--accent2)}
.kicker, .label, .rt, .tt, .hero .t, table.hist th, table.cmp th{font-family:'Geist Mono',ui-monospace,monospace; font-weight:500; letter-spacing:.06em}
.kicker, .label, .rt, .tt, .hero .t{font-size:11px}
.big, .pv, .n, .manchete, .doc .who .nome, a.card h2, .final .n{letter-spacing:-.025em}
.btn, .themebtn{background:var(--chip); color:var(--head); border:0; font-weight:500; border-radius:999px}
.btn:hover, .themebtn:hover{color:var(--head); filter:brightness(.97)}
.btn.solid, .themebtn.solid{background:var(--grad); color:#12110E; border:0; font-weight:500}
.btn.solid:hover, .themebtn.solid:hover{color:#12110E; filter:saturate(1.08) brightness(1.03)}
.card, a.card{border-radius:24px}
.hero, .balao, .duo > div, .mini > div, .note, .regras, .vendedor, .ucs, .benef div, .drop, .switch, .rp{border-radius:18px}
input[type=text], input[type=number], input.pct, select.sel, .uc-cemig select, .ig{border-radius:999px}
input[type=text], input[type=number]{padding-left:15px; padding-right:15px}
input.pct{padding-left:6px; padding-right:6px}
table.hist input{border-radius:10px}
.addbtn{border-radius:999px}
.final{background:var(--grad); color:#12110E}
.tier .eco{background:var(--grad); color:#12110E}
.tier.exa{border-radius:20px}
.chip, .tier .tag{border-radius:999px}
.brand .logo{width:104px}
header > .logo{width:118px}
.logo-pdf{max-width:120px}
/* o gerador de PDF do iPad nao desenha texto com degrade: vai em cor solida */
body.pdf-mode h1 em{background:none; -webkit-text-fill-color:currentColor; color:var(--accent2)}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 2461 1024" role="img" aria-label="exa energia"><use href="#exa-logo"/></svg>
    <button class="themebtn" id="tg" type="button">Tema</button>
  </header>
  <h1>Simuladores <em>exa energia</em>.</h1>
  <div class="cards">
    <a class="card" href="cliente.html">
      <h2>Baixa tensão · Grupo B</h2>
      <p>Quanto o cliente economiza com a exa.</p>
      <span class="go">abrir &rarr;</span>
    </a>
    <a class="card" href="media-tensao.html">
      <h2>Média tensão · Grupo A</h2>
      <p>O desconto ideal e onde mais dá para economizar.</p>
      <span class="go">abrir &rarr;</span>
    </a>
    <a class="card" href="parceiro.html">
      <h2>Ganho do parceiro</h2>
      <p>Quanto o parceiro ganha com a exa.</p>
      <span class="go">abrir &rarr;</span>
    </a>
  </div>
  <footer>exa energia &middot; exaenergia.com</footer>
</div>
<script>
(function(){
  var btn = document.getElementById('tg');
  if (!btn) return;
  btn.addEventListener('click', function(){
    var cur  = document.documentElement.getAttribute('data-theme');
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = cur ? (cur === 'dark' ? 'light' : 'dark') : (dark ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('exa-tema', next); }catch(e){}
  });
})();
</script>
